server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    schemas: corefitpro
    default-schema: corefitpro
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: corefitpro